<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%230d1b2a'/%3E%3Ctext x='32' y='42' font-family='Georgia,serif' font-size='28' fill='%23c9a84c' text-anchor='middle'%3EMM%3C/text%3E%3C/svg%3E">
<title>Página não encontrada | Maicon Matos Advocacia</title><meta name="robots" content="noindex">
<style>*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--navy:#0d1b2a;--navy-mid:#162233;--navy-light:#1e3046;--gold:#c9a84c;--gold-light:#e4c97e;--cream:#f8f4ed;--text:#d6cfc4;--text-muted:#8a8278;--white:#fff;--border:rgba(201,168,76,0.18)}
html{scroll-behavior:smooth}
body{font-family:'DM Sans',sans-serif;background:var(--navy);color:var(--text);line-height:1.7;overflow-x:hidden}
a{color:inherit}
nav{position:fixed;top:0;left:0;right:0;z-index:100;display:flex;align-items:center;justify-content:space-between;padding:20px 6vw;background:rgba(13,27,42,0.9);backdrop-filter:blur(12px);border-bottom:1px solid var(--border)}
.nav-logo{font-family:'Cormorant Garamond',serif;font-size:1.15rem;font-weight:500;color:var(--gold);letter-spacing:.04em;text-decoration:none}
.nav-logo span{color:var(--text);font-style:italic}
.nav-links{display:flex;gap:28px;font-size:.78rem;letter-spacing:.1em;text-transform:uppercase}
.nav-links a{color:var(--text-muted);text-decoration:none;transition:color .2s}
.nav-links a:hover{color:var(--gold)}
.eyebrow{display:inline-flex;align-items:center;gap:10px;font-size:.7rem;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);margin-bottom:20px}
.eyebrow::before{content:'';width:24px;height:1px;background:var(--gold)}
h1,h2{font-family:'Cormorant Garamond',serif;font-weight:500;color:var(--white);line-height:1.1}
h1{font-size:clamp(2.4rem,6vw,4.2rem);margin-bottom:24px}
h2{font-size:clamp(1.8rem,4vw,2.6rem);margin-bottom:16px}
h1 em,h2 em{font-style:italic;color:var(--gold)}
section{padding:96px 6vw;max-width:1180px;margin:0 auto}
.hero{min-height:88vh;display:flex;flex-direction:column;justify-content:center;padding-top:140px}
.hero p{max-width:620px;font-size:1.05rem;font-weight:300}
.btn{display:inline-block;margin-top:36px;padding:15px 30px;background:var(--gold);color:var(--navy);text-decoration:none;font-size:.82rem;letter-spacing:.12em;text-transform:uppercase;font-weight:500;transition:background .2s}
.btn:hover{background:var(--gold-light)}
.btn-ghost{background:transparent;color:var(--gold);border:1px solid var(--gold);margin-left:12px}
.btn-ghost:hover{background:rgba(201,168,76,.1)}
.areas{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--border);border:1px solid var(--border);margin-top:40px}
.area{background:var(--navy-mid);padding:32px 28px}
.area h3{font-family:'Cormorant Garamond',serif;font-size:1.35rem;font-weight:500;color:var(--gold-light);margin-bottom:8px}
.area p{font-size:.92rem;color:var(--text-muted)}
.intro{max-width:640px;color:var(--text-muted)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:24px;margin-top:40px}
.card{display:flex;flex-direction:column;background:var(--navy-mid);border:1px solid var(--border);padding:28px;text-decoration:none;transition:border-color .2s,transform .2s}
.card:hover{border-color:var(--gold);transform:translateY(-3px)}
.card-tag{font-size:.68rem;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);margin-bottom:12px}
.card h3{font-family:'Cormorant Garamond',serif;font-size:1.35rem;font-weight:500;color:var(--white);line-height:1.25;margin-bottom:12px}
.card p{font-size:.88rem;color:var(--text-muted);flex:1}
.card-link{margin-top:20px;font-size:.78rem;letter-spacing:.1em;text-transform:uppercase;color:var(--gold)}
.sobre{display:grid;grid-template-columns:1fr 1fr;gap:56px;align-items:start}
.sobre p{margin-bottom:16px}
.sobre .info{background:var(--navy-mid);border:1px solid var(--border);padding:32px}
.info dt{font-size:.68rem;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);margin-top:16px}
.info dt:first-child{margin-top:0}
.info dd{color:var(--white)}
.contato{text-align:center;border-top:1px solid var(--border)}
.contato p{max-width:560px;margin:0 auto;color:var(--text-muted)}
.aviso{font-size:.75rem;color:var(--text-muted);max-width:640px;margin:32px auto 0;opacity:.8}
footer{padding:32px 6vw;border-top:1px solid var(--border);font-size:.78rem;color:var(--text-muted);display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between}
footer a{text-decoration:none}footer a:hover{color:var(--gold)}
.footer-logo{font-family:'Cormorant Garamond',serif;font-size:1rem;color:var(--gold)}
@media(max-width:760px){.nav-links{display:none}.sobre{grid-template-columns:1fr;gap:32px}section{padding:72px 16px}nav{padding:16px}.btn-ghost{margin-left:0;margin-top:12px}.hero .btns{display:flex;flex-direction:column;align-items:flex-start}.cards{grid-template-columns:1fr}.areas{grid-template-columns:1fr}}</style></head><body>
<nav><a href="/" class="nav-logo">MM <span>Advocacia</span></a></nav>
<section class="hero"><div class="eyebrow">Erro 404</div><h1>Página <em>não encontrada</em></h1><p>O endereço pode ter mudado. Veja os artigos na página inicial.</p><div class="btns"><a href="/#artigos" class="btn">Ver artigos</a></div></section>
</body></html>
